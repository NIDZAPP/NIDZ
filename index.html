<!DOCTYPE html>
<!-- `lang` and `dir` are corrected by src/i18n.ts once the detected locale
     resolves; these are the served defaults. -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nidz — Algeria Pet Care Marketplace</title>
    <!-- No "trusted"/"verified" and no "near you": Nidz vets nobody yet and does
         not use geolocation. Metadata is a product claim like any other (§6.1). -->
    <meta name="description" content="Nidz connects pet owners with pet sitters in Algeria." />
    <meta name="author" content="Nidz" />
    <!-- Readex Pro (Latin + Arabic) is self-hosted through @fontsource and
         imported in src/main.tsx: no third-party font request. -->
    <link rel="canonical" href="/" />
    <meta property="og:title" content="Nidz — Algeria Pet Care Marketplace" />
    <meta property="og:description" content="Find pet sitters in Algeria." />
    <meta property="og:type" content="website" />
    <!-- The Lovable scaffold's og:image and @lovable_dev handle were making every
         shared Nidz link render another company's card. Removed rather than
         replaced: a real share image belongs with the brand asset set. -->
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#EDF2F0" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
